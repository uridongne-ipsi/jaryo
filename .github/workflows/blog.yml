name: 블로그 최근 글 목록
on:
  schedule:
    - cron: "*/5 * * * *"   # 5분마다(GitHub 최소 간격) — GitHub가 바쁠 때는 늦어질 수 있음
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/blog_rss.py
      - run: |
          if [ -n "$(git status --porcelain blog.json)" ]; then
            git config user.name "uridongne-ipsi"
            git config user.email "uridongne-ipsi@users.noreply.github.com"
            git add blog.json && git commit -m "블로그 최근 글 목록 갱신" && git push
          fi
